version: '3'

tasks:
  # Build the application
  build:
    desc: "Build the application"
    cmds:
      - go build -o immich-fave-to-album

  # Run the application
  run:
    desc: "Run the application"
    cmds:
      - go run main.go {{.CLI_ARGS}}

  # Test the application
  test:
    desc: "Run tests"
    cmds:
      - go test ./...

  # Clean build artifacts
  clean:
    desc: "Clean build artifacts"
    cmds:
      - rm -f immich-fave-to-album

  # Run go vet to check for issues
  vet:
    desc: "Run go vet to check for issues"
    cmds:
      - go vet ./...

  # Format the code
  fmt:
    desc: "Format the code"
    cmds:
      - go fmt ./...

  # Run all quality checks
  check:
    desc: "Run all quality checks"
    deps: [vet, fmt, test]

  # Show help
  help:
    desc: "Show this help message"
    cmds:
      - task --list

  # Development workflow
  dev:
    desc: "Development workflow - build, check, and run"
    deps: [build, check]
    cmds:
      - echo "Ready for development! Use 'task run ARGS=\"your args\"' to run"

  # Release - build and push multi-platform Docker image
  release:
    desc: "Build and push multi-platform Docker image (amd64/arm64) to mrwetsnow/immich-tools with date and latest tags"
    cmds:
      - |
        # Generate date-based tag (YYYYMMDDHHMM format for multiple releases per day)
        DATE_TAG=$(date +%Y%m%d%H%M)
        IMAGE_NAME=mrwetsnow/immich-tools
        echo "🏗️  Building multi-platform Docker image with tag: ${DATE_TAG}"
        echo "🏗️  Image will also be tagged as: latest"
        echo "🏗️  Building for platforms: linux/amd64, linux/arm64"

        # Build and push multi-platform Docker image using buildx
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          --tag ${IMAGE_NAME}:${DATE_TAG} \
          --tag ${IMAGE_NAME}:latest \
          --push \
          .

        echo "✅ Release completed successfully!"
        echo "📅 Date tag: ${DATE_TAG}"
        echo "🔗 Repository: https://hub.docker.com/r/${IMAGE_NAME}"
        echo "📦 Multi-platform image supports both AMD64 and ARM64 architectures"
